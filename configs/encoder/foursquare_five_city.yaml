# Text and GraphSAGE encoders for the Foursquare five-city catalog. Produces
# the address-free text embeddings and 128-dimensional graph embeddings that
# configs/tokenization/multi_city/foursquare_five_city/dense_full_transfer.yaml
# reads.
#
#   uv run semoflow-train encoder --config configs/encoder/foursquare_five_city.yaml

experiment:
  name: encoder_foursquare_five_city
  phase: encoder

tokenizer_config:
  preprocessing_dir: outputs/preprocessing/foursquare_five_city
  places_index_path: null      # null => preprocessing_dir/places_index.parquet
  processed_visits_path: null  # null => preprocessing_dir/processed_visits.parquet
  text_embeddings_path: outputs/encoder/foursquare_five_city/text_address_free/text_embeddings.npy
  graphsage_artifact_dir: outputs/encoder/foursquare_five_city/graph_v2

encoder_pipeline:
  graph:
    enabled: true
    device: cuda:0

    # ── Objective ────────────────────────────────────────────────
    temperature: 0.07
    # Bound the contrastive logits matrix along both axes.
    max_negatives: 2048
    max_queries: 262144

    # ── Architecture ─────────────────────────────────────────────
    hidden_dim: 512
    out_dim: 128
    num_layers: 2
    aggr: mean
    layer_norm: true
    residual: true
    dropout: 0.1
    id_embedding_dim: 64

    # ── Redundancy regularization ────────────────────────────────
    variance_weight: 1.0
    covariance_weight: 0.04
    variance_target: 1.0

    # ── Optimization ─────────────────────────────────────────────
    epochs: 50
    batch_size: 4194304
    lr: 0.001
    num_workers: 8
    mixed_precision: bf16
    num_neighbors: [10, 10]

    # ── Graph construction ───────────────────────────────────────
    hash_train_fraction: 0.70
    seed: 42
    out_dir: outputs/encoder/foursquare_five_city/graph_v2
    resume_checkpoint: outputs/encoder/foursquare_five_city/graph_v2/checkpoints/best.pt
    cache_version: 1
    cache_payload: graph_data.pt
    cache_meta: meta.json
    covisit_tc_hours: 6.0

  text:
    enabled: true
    model: sentence-t5-xxl
    device: cuda:0
    batch_size: 256
    precision: float32
    backend: torch
    include_address_in_template: false
    include_name_in_template: true
    out_path: outputs/encoder/foursquare_five_city/text_address_free/text_embeddings.npy

output:
  output_dir: outputs/encoder/foursquare_five_city/graph_v2
