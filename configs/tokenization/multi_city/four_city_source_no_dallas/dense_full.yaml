# Joint tokenizer for Boston, Chicago, New York City, and Pittsburgh.
# Uses six K=48 codebooks with PCA text/graph and relative geographic features.

experiment:
  name: four_city_source_no_dallas_dense_f_full
  phase: tokenizer

tokenizer_config:
  n_codebooks: 6
  codebook_size: 48
  latent_dim: 256
  hidden_dim: 512
  n_encoder_layers: 4
  epochs: 50
  batch_size: 1024
  lr: 0.001
  beta: 3.0
  lambda_graph: 0.0
  sk_epsilons: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
  mixed_precision: bf16
  num_workers: 4
  input_embedding_source: pca_concat
  pca_text_dim: 32
  pca_graph_dim: 32
  geo_relative_dim: 6
  geo_scale: 5
  text_graph_scale: 2.5
  graphsage_artifact_dir: outputs/encoder/four_city_source_no_dallas/graph_v2_address_free_no_users
  text_embeddings_path: outputs/encoder/four_city_source_no_dallas/text_address_free/text_embeddings.npy
  preprocessing_dir: outputs/preprocessing/four_city_source_no_dallas
  places_index_path: null
  processed_visits_path: null
  out_dir: outputs/tokenization/four_city_source_no_dallas/dense_f_full
  device: cuda:3
  seed: 42
  skip_artifact_export: false
  skip_semantic_id_eval: true
  eval_sample_size: 50000
  eval_pair_sample_size: 2000000
