[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semoflow"
version = "0.1.0"
description = "Weekly POI-visit trajectory generation with hierarchical Semantic IDs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=1.26",
    "polars>=1.40.1",
    "pyyaml>=6.0.1",
    "torch>=2.12,<2.13",
    "tqdm>=4.66.4",
    "typer>=0.12.0",
    "torch-geometric>=2.5.0",
    "pyg-lib>=0.7.0",
    "colored>=2.3.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
semoflow-train = "semoflow.cli.train:main"
semoflow-eval = "semoflow.cli.eval:main"
semoflow-preprocess = "semoflow.cli.preprocess:main"
semoflow-artifacts = "semoflow.cli.artifacts:main"

[dependency-groups]
lint = [
    "ruff>=0.6.0",
]
typecheck = [
    "ty>=0.0.1a14",
]
test = [
    "pytest>=8",
    "pytest-xdist>=3.5.0",
]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "faiss-gpu-cu12>=1.13.0; python_version < '3.14'",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["semoflow*"]

[tool.uv]
package = true
default-groups = ["dev"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
pyg-lib = [
  { url = "https://data.pyg.org/whl/torch-2.12.0%2Bcu130/pyg_lib-0.7.0%2Bpt212cu130-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'" },
  { url = "https://data.pyg.org/whl/torch-2.12.0%2Bcu130/pyg_lib-0.7.0%2Bpt212cu130-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'" },
  { url = "https://data.pyg.org/whl/torch-2.12.0%2Bcu130/pyg_lib-0.7.0%2Bpt212cu130-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.14'" },
]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
replace-imports-with-any = [
    "torch",
    "torch.**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit._script",
]

[tool.ty.src]
include = ["src", "tests"]
