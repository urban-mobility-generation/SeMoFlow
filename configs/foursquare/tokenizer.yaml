# Foursquare five-city tokenizer with six K=32 codebooks and PCA text/graph
# features. Reads the outputs of configs/foursquare/encoder.yaml.
#
#   uv run semoflow-train tokenizer --config configs/foursquare/tokenizer.yaml

experiment:
  name: foursquare_tokenizer
  phase: tokenizer

tokenizer_config:
  n_codebooks: 6
  codebook_size: 32
  latent_dim: 256
  hidden_dim: 512
  n_encoder_layers: 4
  epochs: 50
  batch_size: 1024
  lr: 0.001
  beta: 3.0
  lambda_graph: 0.0
  sk_epsilons: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
  mixed_precision: bf16
  num_workers: 4
  input_embedding_source: pca_concat
  pca_text_dim: 32
  pca_graph_dim: 32
  geo_relative_dim: 6
  geo_scale: 5
  text_graph_scale: 2.5
  graphsage_artifact_dir: outputs/encoder/graph
  text_embeddings_path: outputs/encoder/text/text_embeddings.npy
  preprocessing_dir: outputs/preprocessing
  places_index_path: outputs/preprocessing/places_index.parquet
  processed_visits_path: outputs/preprocessing/processed_visits.parquet
  out_dir: outputs/tokenization
  device: cuda:0
  seed: 42
  skip_artifact_export: false
  skip_semantic_id_eval: false
  eval_sample_size: 50000
  eval_pair_sample_size: 2000000
