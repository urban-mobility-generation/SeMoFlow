# New York City SID tokenizer with six K=48 codebooks and PCA text/graph features.

experiment:
  name: new_york_city_v2_shaped_6cb_k48_t32_s2
  phase: tokenizer
tokenizer_config:
  n_codebooks: 6
  codebook_size: 48
  latent_dim: 256
  hidden_dim: 512
  n_encoder_layers: 4
  epochs: 50
  batch_size: 1024
  lr: 0.001
  beta: 3.0
  lambda_graph: 0.0
  sk_epsilons:
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  mixed_precision: bf16
  num_workers: 4
  input_embedding_source: pca_concat
  pca_text_dim: 32
  text_graph_scale: 2.0
  graphsage_artifact_dir: outputs/encoder/new_york_city/graph_v2
  text_embeddings_path: outputs/encoder/new_york_city/text_address_free/text_embeddings.npy
  preprocessing_dir: outputs/preprocessing/new_york_city
  places_index_path: null
  processed_visits_path: null
  out_dir: outputs/tokenization/new_york_city_v2/shaped_6cb_k48_t32_s2
  device: cuda:6
  seed: 42
  skip_artifact_export: false
  skip_semantic_id_eval: false
  eval_sample_size: 50000
  eval_pair_sample_size: 2000000
