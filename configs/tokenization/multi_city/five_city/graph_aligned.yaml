# Joint five-city graph-aligned RQ-VAE with eight K=64 codebooks.
# Choose the planner prefix depth after inspecting tokenizer-hierarchy metrics.
#
#   uv run semoflow-train tokenizer \
#     --config configs/tokenization/multi_city/five_city/graph_aligned.yaml

experiment:
  name: five_city_graph_aligned_8cb_k64_pca_concat_skdiv
  phase: tokenizer

tokenizer_config:
  n_codebooks: 8
  codebook_size: 64
  latent_dim: 128
  hidden_dim: 256
  n_encoder_layers: 4
  beta: 3.0
  lambda_graph: 1
  sk_epsilons: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
  preprocessing_dir: outputs/preprocessing/five_city
  text_embeddings_path: outputs/encoder/five_city/text_address_free/text_embeddings.npy
  graphsage_artifact_dir: outputs/encoder/five_city/graph_v2_address_free
  input_embedding_source: pca_concat
  pca_text_dim: 32
  out_dir: outputs/tokenization/five_city/graph_aligned_8cb_k64_pca_concat_skdiv
  skip_artifact_export: false
  eval_sample_size: 50000
  eval_pair_sample_size: 2000000
  device: cuda:4
